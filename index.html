
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taxi Demand Analysis - Makkah</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
    }

    header {
      padding: 14px 18px;
      background: #17365d;
      color: white;
    }

    .cabecera {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 21px;
      margin: 0 0 12px;
    }

    .controles {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .grupo {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 13px;
    }

    select,
    input,
    button {
      min-height: 38px;
      padding: 8px 10px;
      border-radius: 5px;
      font-size: 14px;
    }

    select,
    input {
      border: 1px solid #bbb;
      background: white;
      color: #222;
    }

    input {
      width: 145px;
    }

    button {
      cursor: pointer;
      border: 1px solid #ddd;
      background: white;
      color: #17365d;
      font-weight: bold;
    }

    button:hover {
      background: #e8eef5;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #selector {
      min-width: 105px;
    }

    #modo {
      min-width: 180px;
    }

    #estado {
      font-size: 13px;
      margin-top: 9px;
    }

    #resumen {
      font-size: 13px;
      margin-top: 5px;
    }

    #map {
      height: calc(100vh - 155px);
      min-height: 400px;
    }

    .leyenda {
      background: white;
      padding: 10px;
      line-height: 1.6;
      box-shadow: 0 1px 5px #999;
      border-radius: 5px;
      color: #222;
    }

    .muestra {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 6px;
      vertical-align: middle;
      border: 1px solid #777;
    }

    @media (max-width: 650px) {
      .cabecera {
        flex-direction: column;
      }

      .controles {
        width: 100%;
        align-items: stretch;
      }

      .grupo {
        flex: 1 1 135px;
      }

      input,
      select {
        width: 100%;
        min-width: 0;
      }

      #map {
        height: calc(100vh - 280px);
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="cabecera">
      <div>
        <h1>Taxi demand per hours</h1>
      </div>

      <div class="controles">
        <div class="grupo">
          <label for="selector">Select hour:</label>
          <select id="selector"></select>
        </div>

        <div class="grupo">
          <label for="flota">Total available taxis:</label>
          <input
            id="flota"
            type="number"
            min="0"
            step="1"
            placeholder="e.g. 1000">
        </div>

        <div class="grupo">
          <label>&nbsp;</label>
          <button id="calcular">Calculate distribution</button>
        </div>

        <div class="grupo">
          <label for="modo">Map display:</label>
          <select id="modo">
            <option value="pickups">Number of Trips</option>
            <option value="taxis">Recommended Taxis</option>
          </select>
        </div>

        <div class="grupo">
          <label>&nbsp;</label>
          <button id="recargar">Refresh data</button>
        </div>
      </div>
    </div>

    <div id="estado">Loading data from QGIS Cloud...</div>
    <div id="resumen"></div>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const servicio =
      "https://wms.prod.qgiscloud.com/dohanyan16/TaxiQaid_Demand_Analysis";

    const capa = "Weekly_Analysis";

    const mapa = L.map("map", {
      center: [21.3891, 39.8579],
      zoom: 12
    });

    // Fondo de imágenes satelitales
    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        attribution: "Imagery &copy; Esri",
        maxZoom: 19
      }
    ).addTo(mapa);

    const selector = document.getElementById("selector");
    const flotaInput = document.getElementById("flota");
    const botonCalcular = document.getElementById("calcular");
    const botonRecargar = document.getElementById("recargar");
    const selectorModo = document.getElementById("modo");
    const estado = document.getElementById("estado");
    const resumen = document.getElementById("resumen");

    for (let h = 0; h < 24; h++) {
      const campo = String(h).padStart(2, "0") + ".00";
      const opcion = document.createElement("option");

      opcion.value = campo;
      opcion.textContent =
        String(h).padStart(2, "0") + ":00";

      selector.appendChild(opcion);
    }

    let datosGeoJSON = null;
    let capaMapa = null;
    let controlLeyenda = null;
    let bucion = null;
    let cargando = false;

    const coloresPickups = [
      "#ffffb2",
      "#fecc5c",
      "#fd8d3c",
      "#f03b20",
      "#bd0026"
    ];

    const coloresTaxis = [
      "#edf8fb",
      "#b2e2e2",
      "#66c2a4",
      "#2ca25f",
      "#006d2c"
    ];

    function obtenerValor(propiedades, campo) {
      const original = propiedades[campo];

      if (
        original === null ||
        original === undefined ||
        original === ""
      ) {
        return null;
      }

      const valor = Number(original);

      return Number.isFinite(valor) && valor >= 0
        ? valor
        : null;
    }

    function crearCortes(valores) {
      const ordenados = [...valores].sort((a, b) => a - b);

      if (!ordenados.length) return [];

      return [0.2, 0.4, 0.6, 0.8].map(p => {
        const indice = Math.floor((ordenados.length - 1) * p);
        return ordenados[indice];
      });
    }

    function obtenerIndice(valor, cortes) {
      if (valor === null || !cortes.length) return -1;

      let indice = cortes.findIndex(corte => valor <= corte);

      if (indice === -1) indice = 4;

      return indice;
    }

    function escaparHTML(valor) {
      return String(valor).replace(/[&<>"']/g, caracter => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[caracter]);
    }

    /*
     * Calcula una distribución proporcional de taxis.
     *
     * 1. Cuota teórica = pick-ups de la zona / total de pick-ups
     *    multiplicado por el total de taxis.
     * 2. Asigna la parte entera de cada cuota.
     * 3. Distribuye los taxis restantes por mayor resto decimal.
     * 4. En caso de empate, prioriza la zona con más pick-ups.
     *
     * Las zonas sin datos no participan en el cálculo.
     * Las zonas con cero pick-ups reciben cero taxis.
     */
    function calcularDistribucion(totalTaxis, campo) {
      const zonas = datosGeoJSON.features.map((feature, indice) => ({
        feature,
        indice,
        pickups: obtenerValor(feature.properties, campo)
      }));

      const zonasConDato = zonas.filter(
        zona => zona.pickups !== null
      );

      const totalPickups = zonasConDato.reduce(
        (suma, zona) => suma + zona.pickups,
        0
      );

      const porZona = new Map();

      zonas.forEach(zona => {
        porZona.set(
          zona.feature,
          zona.pickups === null ? null : 0
        );
      });

      if (totalPickups === 0 || totalTaxis === 0) {
        return {
          porZona,
          totalPickups,
          totalAsignados: 0,
          totalTaxis,
          zonasConDemanda: zonasConDato.filter(
            zona => zona.pickups > 0
          ).length
        };
      }

      const elegibles = zonasConDato.filter(
        zona => zona.pickups > 0
      );

      const reparto = elegibles.map(zona => {
        const cuota =
          (zona.pickups / totalPickups) * totalTaxis;

        const base = Math.floor(cuota);

        return {
          ...zona,
          base,
          resto: cuota - base
        };
      });

      const asignadosIniciales = reparto.reduce(
        (suma, zona) => suma + zona.base,
        0
      );

      const sobrantes = totalTaxis - asignadosIniciales;

      // Los mayores restos reciben primero los taxis restantes.
      // Los empates se resuelven priorizando más pick-ups.
      reparto.sort((a, b) =>
        (b.resto - a.resto) ||
        (b.pickups - a.pickups) ||
        (a.indice - b.indice)
      );

      for (let i = 0; i < sobrantes; i++) {
        reparto[i].base += 1;
      }

      reparto.forEach(zona => {
        porZona.set(zona.feature, zona.base);
      });

      const totalAsignados = reparto.reduce(
        (suma, zona) => suma + zona.base,
        0
      );

      return {
        porZona,
        totalPickups,
        totalAsignados,
        totalTaxis,
        zonasConDemanda: elegibles.length
      };
    }

    function actualizarMapa() {
      if (!datosGeoJSON) return;

      const campo = selector.value;
      const modo = selectorModo.value;

      if (modo === "taxis" && !distribucion) {
        estado.textContent =
          "Enter the fleet size and calculate the distribution first.";
        resumen.textContent = "";
        return;
      }

      const obtenerValorVisual = feature => {
        if (modo === "taxis") {
          return distribucion.porZona.get(feature) ?? null;
        }

        return obtenerValor(feature.properties, campo);
      };

      const valores = datosGeoJSON.features
        .map(obtenerValorVisual)
        .filter(valor => valor !== null);

      const cortes = crearCortes(valores);

      const colores = modo === "taxis"
        ? coloresTaxis
        : coloresPickups;

      if (capaMapa) {
        mapa.removeLayer(capaMapa);
      }

      capaMapa = L.geoJSON(datosGeoJSON, {
        style: feature => {
          const valor = obtenerValorVisual(feature);

          if (valor === null) {
            return {
              color: "#555",
              weight: 1,
              fillColor: "#bdbdbd",
              fillOpacity: 0.7
            };
          }

          const indice = obtenerIndice(valor, cortes);

          return {
            color: "#555",
            weight: 0.7,
            fillColor: colores[Math.max(0, indice)],
            fillOpacity: 0.75
          };
        },

        onEachFeature: (feature, layer) => {
          const propiedades = feature.properties;
          const nombre = propiedades.name ?? "Zona sin nombre";
          const pickups = obtenerValor(propiedades, campo);

          let contenido =
            "<b>" + escaparHTML(nombre) + "</b><br>" +
            "Hora: " + campo.replace(".", ":") + "<br>" +
            "Number of Trips: " +
            (pickups === null ? "Sin datos" : pickups);

          if (distribucion) {
            const taxis = distribucion.porZona.get(feature);

            contenido +=
              "<br>Recommended taxis: " +
              (taxis === null || taxis === undefined
                ? "Sin datos"
                : taxis);

            if (taxis !== null && taxis !== undefined) {
              const porcentaje = distribucion.totalTaxis > 0
                ? (taxis / distribucion.totalTaxis) * 100
                : 0;

              contenido +=
                "<br>Fleet share: " +
                porcentaje.toFixed(2) + "%";
            }
          }

          layer.bindPopup(contenido);
        }
      }).addTo(mapa);

      if (controlLeyenda) {
        mapa.removeControl(controlLeyenda);
      }

      controlLeyenda = L.control({
        position: "bottomright"
      });

      controlLeyenda.onAdd = function () {
        const div = L.DomUtil.create("div", "leyenda");

        const titulo = modo === "taxis"
          ? "Taxis recomendados"
          : "Number of Trips";

        let html = "<b>" + titulo + " · " +
          campo.replace(".", ":") + "</b><br>";

        for (let i = 0; i < 5; i++) {
          let etiqueta;

          if (!valores.length) {
            etiqueta = "Sin datos";
          } else if (i === 0) {
            etiqueta = "≤ " + cortes[0];
          } else if (i === 4) {
            etiqueta = "> " + cortes[3];
          } else {
            etiqueta = cortes[i - 1] + " – " + cortes[i];
          }

          html +=
            '<span class="muestra" style="background:' +
            colores[i] + '"></span>' +
            etiqueta + "<br>";
        }

        div.innerHTML = html;
        L.DomEvent.disableClickPropagation(div);
        return div;
      };

      controlLeyenda.addTo(mapa);

      if (distribucion) {
        const sinAsignar =
          distribucion.totalTaxis - distribucion.totalAsignados;

        resumen.textContent =
          "Available fleet: " + distribucion.totalTaxis +
          " | Assigned taxis: " + distribucion.totalAsignados +
          " | Free Taxis: " + sinAsignar;

        if (distribucion.totalPickups === 0) {
          estado.textContent =
            "No Trips.";
        } else {
          estado.textContent =
            "Correctly calculated distribution.";
        }
      } else {
        resumen.textContent = "";
        estado.textContent =
          "Data loaded. Select a time or calculate the distribution.";
      }
    }

    async function cargarDatos() {
      if (cargando) return;

      cargando = true;
      botonRecargar.disabled = true;
      estado.textContent = "Loading data from QGIS Cloud...";

      try {
        const parametros = new URLSearchParams({
          service: "WFS",
          version: "1.1.0",
          request: "GetFeature",
          typeName: capa,
          outputFormat: "application/json"
        });

        const respuesta = await fetch(
          servicio + "?" + parametros.toString()
        );

        if (!respuesta.ok) {
          throw new Error("Error HTTP " + respuesta.status);
        }

        const datos = await respuesta.json();

        if (!datos.features || !datos.features.length) {
          throw new Error("El servicio no ha devuelto polígonos.");
        }

        datosGeoJSON = datos;

        // La distribución anterior deja de ser válida
        // después de descargar datos nuevos.
        distribucion = null;
        selectorModo.value = "pickups";

        actualizarMapa();

        const limites = capaMapa.getBounds();

        if (limites.isValid()) {
          mapa.fitBounds(limites, {
            padding: [15, 15]
          });
        } else {
          mapa.setView([21.4, 39.8], 10);
        }

        estado.textContent =
          "Data successfully loaded from QGIS Cloud.";

      } catch (error) {
        console.error(error);

        estado.textContent =
          "The data could not be loaded. Check the WFS service and QGIS Cloud CORS permissions.";

      } finally {
        cargando = false;
        botonRecargar.disabled = false;
      }
    }

    botonCalcular.addEventListener("click", () => {
      if (!datosGeoJSON) {
        estado.textContent =
          "Wait for the data to load before calculating.";
        return;
      }

      const texto = flotaInput.value.trim();
      const total = Number(texto);

      if (
        texto === "" ||
        !Number.isSafeInteger(total) ||
        total < 0
      ) {
        estado.textContent =
          "Enter a whole number of taxis equal to or greater than zero.";
        return;
      }

      distribucion = calcularDistribucion(
        total,
        selector.value
      );

      selectorModo.value = "taxis";

      actualizarMapa();
    });

    selector.addEventListener("change", () => {
      if (distribucion) {
        // Recalcular con la misma flota para la nueva hora.
        distribucion = calcularDistribucion(
          distribucion.totalTaxis,
          selector.value
        );
      }

      actualizarMapa();
    });

    selectorModo.addEventListener("change", actualizarMapa);

    botonRecargar.addEventListener("click", cargarDatos);

    cargarDatos();
  </script>
</body>
</html>
