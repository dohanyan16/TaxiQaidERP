 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moventis | Demand Analysis</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --naranja: #f58220;
      --naranja-oscuro: #df6d12;
      --texto: #243044;
      --gris: #667085;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--naranja);
      color: var(--texto);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 25px 40px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    header span {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      font-weight: normal;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px 60px;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      padding: 42px 38px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(90, 43, 0, 0.2);
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--naranja);
      color: white;
      border-radius: 12px;
      font-size: 27px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      margin: 10px 0 30px;
      color: var(--gris);
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #d0d5dd;
      border-radius: 7px;
      background: white;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--naranja);
      box-shadow: 0 0 0 3px rgba(245, 130, 32, 0.15);
    }

    button {
      width: 100%;
      min-height: 47px;
      margin-top: 8px;
      border: none;
      border-radius: 7px;
      background: var(--naranja);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--naranja-oscuro);
    }

    #mensaje {
      display: none;
      margin-top: 16px;
      color: #b42318;
      font-size: 13px;
      text-align: center;
    }

    footer {
      padding: 18px;
      color: white;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 500px) {
      header {
        padding: 22px;
      }

      .login-card {
        padding: 34px 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    MOVENTIS
    <span>Demand Analysis Platform</span>
  </header>

  <main>
    <section class="login-card">

      <div class="logo" aria-hidden="true">M</div>

      <h1>Welcome back</h1>

      <p class="subtitle">
        Sign in to access the demand analysis platform.
      </p>

      <form id="loginForm">
        <div class="form-group">
          <label for="usuario">Username</label>
          <input
            id="usuario"
            name="username"
            type="text"
            placeholder="Enter your username"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit">Sign in</button>

        <p id="mensaje" role="alert">
          Authentication is not configured yet.
        </p>
      </form>

    </section>
  </main>

  <footer>
    Demand Analysis Platform · Moventis
  </footer>

  <script>
    document.getElementById("loginForm").addEventListener(
      "submit",
      function(event) {
        event.preventDefault();

        document.getElementById("mensaje").style.display = "block";
      }
    );
  </script>

</body>
</html>
